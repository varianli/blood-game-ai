<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0508">
<title>血之游戏</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>

<!-- ============ 加入 ============ -->
<div id="join" class="phone">
  <div style="text-align:center;padding:26px 0 10px">
    <div class="brand" style="font-size:40px">血 之 游 戏</div>
  </div>
  <div class="card" style="display:flex;flex-direction:column;gap:14px">
    <div class="frow">
      <span class="label">房间号（大屏幕上那 4 位数字）</span>
      <input class="field" id="jRoom" inputmode="numeric" maxlength="6"
             placeholder="0000"
             style="font-size:32px;text-align:center;letter-spacing:10px;font-weight:900">
    </div>
    <div class="frow">
      <span class="label">你的名字</span>
      <input class="field" id="jName" maxlength="12" placeholder="怎么称呼你">
    </div>
    <div id="jPick" class="namelist"></div>
    <button class="btn" id="jGo" style="padding:16px">进入房间</button>
    <div class="note" id="jMsg"></div>
  </div>
</div>

<!-- ============ 游戏 ============ -->
<div id="app" class="phone hide">
  <div class="phead">
    <span class="me" id="pName">—</span>
    <span id="pRank" class="pill" style="padding:4px 10px">—</span>
    <button id="pSwitch" class="pill" style="padding:4px 10px;background:transparent">换人</button>
    <span class="spacer"></span>
    <span class="sc" id="pScore">0</span>
  </div>
  <div class="timerbar"><i id="pBar" style="width:0%"></i></div>
  <div class="pmain" id="pMain"></div>
</div>

<script src="/player.js"></script>
</body>
</html>
